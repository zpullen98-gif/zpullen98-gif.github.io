<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Outside Of Time">
  <!-- A clock face with no hands: the hours are marked, the time is not kept. -->
  <rect width="64" height="64" rx="12" fill="#12100e"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#c6a664" stroke-width="2.5"/>
  <g stroke="#c6a664" stroke-width="2.5" stroke-linecap="round">
    <path d="M32 15.5v4"/>
    <path d="M32 44.5v4"/>
    <path d="M15.5 32h4"/>
    <path d="M44.5 32h4"/>
  </g>
  <circle cx="32" cy="32" r="2.6" fill="#e0c48b"/>
</svg>
