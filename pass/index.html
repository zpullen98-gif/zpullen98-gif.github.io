<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Pass · Outside Of Time</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Outside Of Time">
<meta name="description" content="Who on this device is training, how far they have got, and where the team is weakest.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12100e">
<link rel="stylesheet" href="../shared/oot-home.css?v=23">
<style>
/* ============ The Pass ============
   One page for the whole product rather than one per wing. It reads what every
   wing has already written to this device, so it needs no content of its own
   and stays a few kilobytes.

   It uses the hub's palette, not any wing's, because it belongs to the product
   rather than to the Codex or the Ledger. Those are the tokens duplicated in
   oot-gate's paywall and the hub itself; this is the third place they appear,
   which is two too many, but extracting them is a separate job to the one in
   front of us.
   ============ */
:root{
  --ink:#12100e; --ink-2:#1a1714; --line:rgba(198,166,100,.22);
  --brass:#c6a664; --brass-hi:#e0c48b; --cream:#f0eae0; --dim:rgba(240,234,224,.62);
  --oot-accent:var(--brass); --oot-line:var(--line); --oot-ink:var(--cream);
  --oot-dim:var(--dim); --oot-raise:var(--ink-2);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ink); color:var(--cream);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:calc(46px + env(safe-area-inset-top)) 20px 64px;
  -webkit-font-smoothing:antialiased;
}
.sheet{max-width:820px;margin:0 auto}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(1.9rem,5vw,2.6rem);
   margin:0 0 6px;letter-spacing:.01em}
.lede{color:var(--dim);margin:0 0 26px;max-width:60ch}
a{color:var(--brass-hi)}
.back{display:inline-block;margin-bottom:22px;font-size:.85rem;color:var(--dim);text-decoration:none;
      letter-spacing:.06em;text-transform:uppercase}
.back:hover{color:var(--brass-hi)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
th,td{padding:.55em .6em;text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
         border-bottom:1px solid var(--line);font-weight:500}
tbody td{border-bottom:1px solid var(--line)}
.tablewrap{overflow-x:auto}
.empty{border:1px solid var(--line);padding:20px;color:var(--dim)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);
       color:var(--dim);font-size:.82rem;max-width:60ch}
</style>
</head>
<body>
<div class="sheet">
  <a class="back" href="../">&larr; Outside Of Time</a>
  <h1>The Pass</h1>
  <p class="lede">Everyone who has put their name to a record on this device, what
  they have covered, and where the team is thinnest.</p>
  <div id="pass"></div>
  <footer id="foot"></footer>
</div>

<script src="../shared/oot-config.js?v=23"></script>
<script src="../shared/oot-profiles.js?v=23"></script>
<script src="../shared/oot-home.js?v=23"></script>
<script src="../shared/oot-pass.js?v=23"></script>
<script>
(function () {
  var el = document.getElementById('pass');

  function paint() {
    if (!window.OOT || !OOT.pass) {
      el.innerHTML = '<div class="empty">The shared scripts did not load, so there is ' +
        'nothing to read. Open a wing first.</div>';
      return;
    }
    /* Every wing that ships an induction declares its length here. A wing with
       no path simply does not appear in that panel. */
    el.innerHTML = OOT.pass.view({
      paths: [
        { wing: 'codex', total: 7 },
        { wing: 'ledger', total: 6 }
      ]
    });
    OOT.pass.bind(el, function () {});
  }

  paint();

  var foot = document.getElementById('foot');
  foot.innerHTML = 'Section rankings are worked out by each app while it is open ' +
    'and left here, so they are a snapshot rather than a live figure. Progress ' +
    'itself is kept in this browser and never sent anywhere, which is why this ' +
    'page can only show this device and whatever has been imported into it.';
})();
</script>
</body>
</html>
