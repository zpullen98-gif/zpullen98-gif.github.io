<script>
/* Set the palette BEFORE first paint. sun.js computes the real solar phase a moment
   later, but it loads at the end of the document, and a reader opening this at five
   in the morning should not be hit with a full-brightness page for the two hundred
   milliseconds it takes to get there. A clock guess is wrong at the margins and
   right about the thing that matters: whether it is dark outside. */
try {
  /* One record on this device. This block runs before any script has loaded,
     so no shared layer can reach it: the key has to be written out here. It
     used to read the roster and namespace itself, which is kept below as the
     way back, and which must go back in step with store.js flProfileKey or
     First Light paints one person's palette over another's record.

       var flProf = JSON.parse(localStorage.getItem(ROSTER) || null);
       if (flProf && flProf.current && Array.isArray(flProf.list)) {
         find the entry whose id === flProf.current;
         if it is not legacy, flKey = flKey + the suffix;
       }  */
  var flKey = 'firstlight-v1';
  var flRec = JSON.parse(localStorage.getItem(flKey) || '{}');
  var flPref = (flRec.prefs && flRec.prefs.theme) || 'auto';
  var flH = new Date().getHours();
  var flPhase = flPref !== 'auto' ? flPref
      : (flH < 5 || flH >= 21) ? 'night' : flH < 8 ? 'firstlight' : flH < 18 ? 'day' : 'dusk';
  document.documentElement.setAttribute('data-phase', flPhase);
  /* Match the status bar to the phase immediately. The <meta> above already exists
     by the time this runs, so set it in place: leaving the default would show a
     bright bar over a dark page until sun.js catches up. */
  var flMeta = document.querySelector('meta[name="theme-color"]');
  if (flMeta) flMeta.setAttribute('content',
    { night: '#14161A', firstlight: '#F1ECE4', day: '#EDEFEC', dusk: '#E5E4E7' }[flPhase] || '#EDEFEC');
} catch (e) { document.documentElement.setAttribute('data-phase', 'day'); }
</script>
